# Optional local Postgres. Port 5433 on purpose: this host already runs an unrelated Postgres on 5432.
# Default dev/test database is SQLite (see .env.example); use this when testing the Postgres path.
services:
  db:
    image: postgres:16-alpine
    container_name: sncf-chatbot-db
    environment:
      POSTGRES_USER: sncf
      POSTGRES_PASSWORD: sncf
      POSTGRES_DB: sncf_chatbot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sncf_chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sncf -d sncf_chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sncf_chatbot_pgdata:
