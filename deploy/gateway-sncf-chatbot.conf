# BEGIN managed sncf-chatbot
# https://zhaoyang.fr/sncf-chatbot/ — SNCF liO teacher chatbot (Next.js web + FastAPI).
# Managed by sncf-chatbot/deploy/deploy.sh. Do not edit on the server.
# Only /api/ is exposed from the API: /docs and /openapi.json stay private.
location ^~ /sncf-chatbot/api/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:__API_PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    add_header Cache-Control "no-store" always;
}
# Next.js is built with basePath=/sncf-chatbot and redirects the trailing slash itself:
# no redirect here, or the two would loop.
location = /sncf-chatbot {
    proxy_pass http://127.0.0.1:__WEB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /sncf-chatbot/ {
    proxy_pass http://127.0.0.1:__WEB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
# END managed sncf-chatbot
