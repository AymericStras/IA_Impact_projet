[project]
name = "sncf-chatbot-api"
version = "0.1.0"
description = "FastAPI backend of the SNCF liO teacher chatbot: transcription, structured extraction, state machine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "openai>=1.80",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default values

[tool.ruff.lint.per-file-ignores]
# French strings / descriptions read by the model: length takes precedence over wrapping.
"app/domain/dialogue.py" = ["E501"]
"app/schemas/patch.py" = ["E501"]
"app/api/routes.py" = ["E501"]
"app/main.py" = ["E501"]
"app/domain/pipeline.py" = ["E501"]
"app/services/extraction.py" = ["E501"]
"tests/*" = ["E501"]
"app/services/planner.py" = ["E501"]
"app/services/conversation.py" = ["E501"]
"app/schemas/planning.py" = ["E501"]
"app/schemas/requirements.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
