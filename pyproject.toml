[project]
name = "sncf-rapport"
version = "0.1.0"
description = "Post-trip pedagogical report for parents: renders a PDF from trip data plus the teacher's confirmation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "jinja2>=3.1",
  "weasyprint>=63",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pypdf>=5",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sncf_rapport"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"scripts/*" = ["S603", "S607"]
