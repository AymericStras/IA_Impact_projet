[project]
name = "sncf-bilan"
version = "0.1.0"
description = "Trip recap service: renders a PDF from trip data and emails it through Mailato."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "email-validator>=2.2",
  "jinja2>=3.1",
  "weasyprint>=63",
  "mailato",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pypdf>=5",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sncf_bilan"]

[tool.uv.sources]
mailato = { git = "https://github.com/ze2phyrzhenyin/Mailato", tag = "v0.4.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
