name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with jsonschema python scripts/validate_contracts.py

  api:
    name: API (services/api)
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f services/api/pyproject.toml && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - if: steps.present.outputs.yes == 'true'
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q
      - if: steps.present.outputs.yes == 'true' && hashFiles('scripts/export_schemas.py') != ''
        working-directory: services/api
        run: uv run python ../../scripts/export_schemas.py --check
      - if: steps.present.outputs.yes != 'true'
        run: echo "services/api not present yet — skipped"

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f apps/web/package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.present.outputs.yes == 'true'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
          pnpm lint
          pnpm test -- --run
          pnpm build
      - if: steps.present.outputs.yes != 'true'
        run: echo "apps/web not present yet — skipped"
