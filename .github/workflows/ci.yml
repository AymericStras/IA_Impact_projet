name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate intentional visual changes for review (never auto-commit)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Offline gates only: no model calls, no secrets. Live evals are run manually (see evals/README.md).
jobs:
  guards:
    name: Contracts, secrets, skill parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python3 scripts/secret_scan.py
      - run: python3 scripts/sync_skills.py --check
      - run: uv run --with jsonschema python scripts/validate_contracts.py

  api:
    name: API (services/api)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - working-directory: services/api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q --junitxml=../../reports/api-junit.xml
          uv run python ../../scripts/export_schemas.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: reports/

  web:
    name: Web (apps/web)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
          pnpm lint
          pnpm test -- --run
          pnpm build
      # Portable end-to-end specs (functional flow + responsive matrix, no screenshots): demo mode, no backend.
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - name: Classic flows and responsive layout
        working-directory: apps/web
        run: pnpm test:e2e:ci
      - name: Voice flows and responsive layout
        working-directory: apps/web
        run: pnpm test:e2e:voice:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          include-hidden-files: true
          path: |
            apps/web/test-results/
            apps/web/.next-voice-results/
            apps/web/playwright-report/

  visual:
    name: Visual regression (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install browser dependencies
        id: setup
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium-headless-shell
      # Separate steps keep the voice diffs available even if the classic comparison fails.
      # One worker in each config; builds and suites run sequentially in this isolated VM.
      - name: Classic visual baselines
        working-directory: apps/web
        run: pnpm exec playwright test visual.spec.ts ${{ inputs.update_visual_baselines && '--update-snapshots' || '' }}
      - name: Voice visual baselines
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec playwright test -c playwright.voice.config.ts voice-visual.spec.ts ${{ inputs.update_visual_baselines && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          name: visual-review-macos
          include-hidden-files: true
          path: |
            apps/web/test-results/
            apps/web/.next-voice-results/
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.update_visual_baselines }}
        with:
          name: visual-baseline-candidates-macos
          path: apps/web/e2e/__screenshots__/darwin/
