name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Offline gates only: no model calls, no secrets. Live evals are run manually (see evals/README.md).
jobs:
  guards:
    name: Contracts, secrets, skill parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python3 scripts/secret_scan.py
      - run: python3 scripts/sync_skills.py --check
      - run: uv run --with jsonschema python scripts/validate_contracts.py

  api:
    name: API (services/api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - working-directory: services/api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q --junitxml=../../reports/api-junit.xml
          uv run python ../../scripts/export_schemas.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: reports/

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
          pnpm lint
          pnpm test -- --run
          pnpm build
      # Portable end-to-end specs (functional flow + responsive matrix, no screenshots): demo mode, no backend.
      - working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium-headless-shell
          pnpm test:e2e:ci
          pnpm test:e2e:voice:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
